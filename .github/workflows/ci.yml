name: CI-ARKA

on:
  push:
  pull_request:

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [servicio-solicitudes, servicio-notificaciones]
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # BUG 3: se construye y publica ANTES de probar (se entrega sin verificar)
      - name: Login al registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # BUG 4: credencial HARDCODEADA (debe venir de secrets)
          password: ghp_token_pegado_a_mano_1234567890
      - name: Construir y publicar ${{ matrix.servicio }}
        working-directory: ${{ matrix.servicio }}
        run: |
          IMG=ghcr.io/${{ github.repository }}/${{ matrix.servicio }}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"

      - name: Compilar y probar ${{ matrix.servicio }}
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}
